<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#10204a"/><link rel="icon" href="/logo.svg" type="image/svg+xml"/><link rel="stylesheet" href="/styles.css"/><title>Client checkout · ScopePay AI</title>
<style>
.checkout-body{min-height:100vh;background:#f5f7fc}.checkout-nav{display:flex;justify-content:space-between;align-items:center;padding:24px max(25px,calc((100vw - 920px)/2))}.checkout-nav .brand{margin:0}.checkout-card{max-width:580px;margin:35px auto 75px;padding:38px;border:1px solid #e2e9f3;border-radius:23px;background:white;box-shadow:0 20px 70px #19345c0b}.checkout-card h1{font-size:28px;margin:18px 0 9px}.checkout-card p{font-size:13px}.checkout-amount{border-top:1px solid #edf0f6;border-bottom:1px solid #edf0f6;margin:22px 0;padding:23px 0;display:flex;justify-content:space-between;align-items:center}.checkout-amount b{font-size:32px;letter-spacing:-1px;color:#1d3358}.checkout-item{padding:17px 20px;background:#f7f9fe;border-radius:13px;line-height:1.65;font-size:13px;color:#586984;margin:23px 0}.checkout-item strong{display:block;color:#263b5c;margin-bottom:6px}.checkout-foot{font-size:11px!important;color:#93a0b3;text-align:center;margin-top:20px}.checkout-brand{display:flex;gap:10px;align-items:center;color:#5171dc;font-weight:800;font-size:12px}.checkout-status{text-align:center;padding:36px;background:#f2faf5;border:1px solid #d7f2e3;border-radius:14px;color:#17885e}.checkout-status h2{margin:12px 0 6px}.checkout-status p{word-break:break-all;color:#579779}.checkout-error{padding:20px;background:#fff5f3;color:#aa504b;border-radius:13px;font-size:13px}.checkout-footer{text-align:center;color:#9aabba;font-size:11px;padding-bottom:30px}.checkout-footer a{color:#5374f5}@media(max-width:620px){.checkout-card{margin:10px 15px 55px;padding:24px}.checkout-nav{padding:20px 16px}}
</style></head>
<body class="checkout-body">
 <header class="checkout-nav"><a href="/" class="brand"><img src="/logo.svg" class="brand-icon" alt="ScopePay logo"/><span class="brand-name">scopepay<b>.</b></span></a><span class="badge blue">PayPal Sandbox · Test checkout</span></header>
 <main class="checkout-card" id="checkout"><div class="loading-screen" style="min-height:240px"><span class="spinner"></span> Preparing checkout…</div></main>
 <div class="checkout-footer">ScopePay AI is a prototype. No real payments can be made here.<br/><a href="/">Return to freelancer dashboard</a></div>
 <script type="module" src="/pay.js"></script>
</body></html>
